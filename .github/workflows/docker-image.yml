name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  discover-scripts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Discover build scripts
        id: set-matrix
        uses: actions/github-script@v6
        with:
          script: |
            // Get the repository tree recursively using GitHub API
            const { data: tree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: context.sha,
              recursive: true
            });

            // Filter for build.sh files
            const buildScripts = tree.tree.filter(item =>
              item.type === 'blob' && item.path.endsWith('/build.sh')
            );

            // Demos that cannot build on arm64 yet:
            // basilisk_astrodynamics downloads the x86_64-only Vizard binary.
            // lunar_terrain uses the amd64-only jazzy-2025.10.0 base image.
            // nav2_demo, space_robots and ros_trick use the stacks images, which are amd64 only until space-ros/stacks#295 ships.
            const amd64Only = new Set(['basilisk_astrodynamics', 'lunar_terrain', 'nav2_demo', 'space_robots', 'ros_trick']);
            const platforms = [
              { arch: 'amd64', runner: 'ubuntu-24.04' },
              { arch: 'arm64', runner: 'ubuntu-24.04-arm' }
            ];

            // Create matrix with script path, readable name and platform
            const path = require('path');
            const matrix = buildScripts.flatMap(item => {
              const name = path.basename(path.dirname(item.path));
              return platforms
                .filter(p => p.arch === 'amd64' || !amd64Only.has(name))
                .map(p => ({ script: item.path, name: name, ...p }));
            });

            console.log('Found scripts:', matrix);
            core.setOutput('matrix', JSON.stringify(matrix));

  build:
    needs: discover-scripts
    runs-on: ${{ matrix.runner }}
    if: ${{ fromJson(needs.discover-scripts.outputs.matrix) != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover-scripts.outputs.matrix) }}

    name: Build ${{ matrix.name }} (${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run build script - ${{ matrix.script }}
        run: |
          echo "Running build script: ${{ matrix.script }}"
          script_dir=$(dirname "${{ matrix.script }}")
          echo "Changing to directory: ${script_dir}"
          cd "${script_dir}"
          chmod +x build.sh
          ./build.sh
          echo "Build script ${{ matrix.script }} completed successfully"
